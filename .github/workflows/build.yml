# Vérifie que le code compile à chaque Pull Request et à chaque push sur master.
# Si ce check est rouge, on ne fusionne pas.
name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Compiler l'APK
        run: ./gradlew assembleDebug
